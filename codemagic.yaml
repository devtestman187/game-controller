# Codemagic: iOS builds of Thumb Party (the phone and tablet app).
#
# Workflows:
#   ios-check-main   push to main   } analyze + test + unsigned build, no artifact,
#   ios-check-pr     PRs into main  } only when controller_app/, packages/protocol/ or packages/connection/ change
#   ios-testflight   any tag (e.g. m8), and manual start: signed App Store build, uploaded to
#                    TestFlight (PRD v2 M8). Replaces the unsigned .ipa for iLoader.
#
# ios-testflight needs, once (docs/release.md): an App Store Connect API key added in Codemagic
# (Team settings > Integrations > Developer Portal) under the name "Thumb Party", the app record
# com.thumbparty.app in App Store Connect, and its signing certificate and profile in Codemagic
# (Code signing identities). The build number is the commit count, the same as the Android builds.
#
# Free-minute guards: path filter (changeset), cancel superseded builds, 30 min cap, caches.
# Syntax checked against docs.codemagic.io (Oct 2026): triggering events, branch_patterns
# `source` (false = PR target branch), tag_patterns, when.changeset, cancel_previous_builds,
# max_build_duration, cache_paths.

definitions:
  environment: &environment
    flutter: stable
    xcode: latest # latest stable Xcode on the image ("edge" would be the newest beta)
  cache: &cache
    cache_paths:
      - $FLUTTER_ROOT/.pub-cache
      - $HOME/.pub-cache
      - $HOME/Library/Caches/CocoaPods # only used if a plugin falls back to CocoaPods
  changeset: &changeset
    changeset:
      includes:
        - 'controller_app/'
        - 'packages/protocol/'
        - 'packages/connection/'
        - 'codemagic.yaml'
      excludes:
        - '**/*.md'
  scripts:
    - &pub_get
      name: Get packages (pub workspace)
      script: |
        cd "$CM_BUILD_DIR"
        flutter --version
        flutter pub get
    - &analyze
      name: Analyze
      script: |
        cd "$CM_BUILD_DIR"
        flutter analyze controller_app packages/protocol packages/connection
    - &test
      name: Test
      script: |
        set -euo pipefail
        cd "$CM_BUILD_DIR/packages/protocol" && dart test
        cd "$CM_BUILD_DIR/packages/connection" && dart test
        cd "$CM_BUILD_DIR/controller_app" && flutter test
    - &build_ios
      name: Build iOS (release, no codesign)
      script: |
        cd "$CM_BUILD_DIR/controller_app"
        flutter build ios --release --no-codesign

workflows:
  ios-check-main:
    name: iOS check (push to main)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment: *environment
    cache: *cache
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      cancel_previous_builds: true
    when: *changeset
    scripts:
      - *pub_get
      - *analyze
      - *test
      - *build_ios

  ios-check-pr:
    name: iOS check (pull request)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment: *environment
    cache: *cache
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: false # match the PR's target branch
      cancel_previous_builds: true
    when: *changeset
    scripts:
      - *pub_get
      - *analyze
      - *test
      - *build_ios

  ios-testflight:
    name: iOS TestFlight (tag or manual)
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: Thumb Party
    environment:
      <<: *environment
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.thumbparty.app
    cache: *cache
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: '*' # milestone tags (m8, fixes like m8.1) and any future release tags
          include: true
      cancel_previous_builds: true
    # No changeset filter: every milestone tag (and every manual start) goes to TestFlight.
    scripts:
      - *pub_get
      - *analyze
      - *test
      - name: Use the signing profile
        script: xcode-project use-profiles
      - name: Build the signed .ipa
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          git fetch --unshallow --quiet 2>/dev/null || true
          BUILD=$(git rev-list --count HEAD)
          echo "Build number $BUILD"
          cd controller_app
          flutter build ipa --release \
            --build-number="$BUILD" \
            --dart-define=BUILD_NUMBER="$BUILD" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - controller_app/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Sends each build to Beta App Review for the external group. Add the group name under
        # beta_groups once it exists in App Store Connect (docs/release.md).
        submit_to_testflight: true
        # beta_groups:
        #   - Testers
        submit_to_app_store: false
