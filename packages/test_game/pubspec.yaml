name: test_game
description: >-
  The sprite test game (PRD T7): a top-down arena with walls, moving hazards
  and a goal, driven by any controller input mode. Kept in its own package so
  it can grow into a fuller game.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: '>=3.38.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  protocol:
    path: ../protocol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
