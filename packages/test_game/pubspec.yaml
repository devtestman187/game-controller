name: test_game
description: >-
  The sprite test game (PRD T7): a top-down arena with walls, moving hazards
  and a goal, driven by any controller input mode. Kept in its own package so
  it can grow into a fuller game.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: '>=3.38.0'

resolution: workspace

dependencies:
  connection:
    path: ../connection
  flutter:
    sdk: flutter
  game_kit:
    path: ../game_kit
  protocol:
    path: ../protocol
  toy_look:
    path: ../toy_look

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    # The arena's maps (M14 k1b): map_rules.dart holds the rules they keep.
    - maps/
