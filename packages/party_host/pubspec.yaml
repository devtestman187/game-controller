name: party_host
description: >-
  The host side of Thumb Party (PRD v2 M12): the host service, advertising,
  sound, analytics and the host screens (game picker, join, play, pause,
  results, Puzzle settings, Stats). Used by the TV app, and by the phone
  app's host mode from M12 on.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: '>=3.38.0'

resolution: workspace

dependencies:
  bonsoir: ^7.1.5
  connection:
    path: ../connection
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_soloud: ^5.2.1
  game_assets:
    path: ../../assets
  # For HostingSettings: the frame rate a round runs at (m12 §3).
  game_kit:
    path: ../game_kit
  metrics:
    path: ../metrics
  path: ^1.9.1
  protocol:
    path: ../protocol
  puzzle_game:
    path: ../puzzle_game
  shared_preferences: ^2.5.6
  test_game:
    path: ../test_game
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
