name: controller
description: "Phone game controller (Android + iOS)."
publish_to: 'none'

# build-name -> versionName / CFBundleShortVersionString; build-number -> versionCode / CFBundleVersion.
version: 0.8.0+11

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  bonsoir: ^7.1.5
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  connection:
    path: ../packages/connection
  protocol:
    path: ../packages/protocol
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sensors_plus: ^7.1.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
