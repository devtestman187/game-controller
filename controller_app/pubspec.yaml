# build-name -> versionName / CFBundleShortVersionString; build-number -> versionCode / CFBundleVersion.
version: 0.0.1+1

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  protocol:
    path: ../packages/protocol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
