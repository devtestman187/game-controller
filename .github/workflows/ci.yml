# Analyze, test and build the Dart/Android/Windows parts on every PR and push to main.
# iOS builds run on Codemagic (codemagic.yaml); the macOS fallback is ios-fallback.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  analyze-test-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get packages (pub workspace)
        run: flutter pub get
      - name: Analyze
        run: flutter analyze controller_app tv_test_app packages assets
      - name: Test protocol
        working-directory: packages/protocol
        run: dart test
      - name: Test connection (pairing, heartbeats, reconnect)
        working-directory: packages/connection
        run: dart test
      - name: Test the test game
        working-directory: packages/test_game
        run: flutter test
      - name: Test controller app
        working-directory: controller_app
        run: flutter test
      - name: Test TV app
        working-directory: tv_test_app
        run: flutter test
      - name: Build controller APK
        working-directory: controller_app
        run: flutter build apk --release
      - name: Build TV APK
        working-directory: tv_test_app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            controller_app/build/app/outputs/flutter-apk/app-release.apk
            tv_test_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Build TV app for Windows
        working-directory: tv_test_app
        run: flutter build windows --release
