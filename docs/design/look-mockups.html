<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thumb Party M13: Toy Box Toon mock-ups</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=block" rel="stylesheet">
<style>
  body { margin: 0; font-family: Nunito, sans-serif; background: #f3efe6; color: #1e1646; }
  body.single { background: transparent; }
  header { padding: 20px 24px 8px; }
  h1 { font-family: Fredoka, sans-serif; font-weight: 600; margin: 0 0 6px; }
  .bar button { font: 700 15px Nunito, sans-serif; padding: 8px 14px; margin-right: 6px; border: 3px solid #1e1646; border-radius: 99px; background: #fff6e3; cursor: pointer; }
  .bar button.on { background: #ffd23f; }
  figure { margin: 18px 24px 28px; }
  figcaption { font-weight: 700; margin-bottom: 8px; max-width: 960px; }
  figcaption span { font-weight: 600; opacity: .75; display: block; }
  svg { display: block; max-width: 100%; height: auto; }
  body.single svg { max-width: none; }
</style>
</head>
<body>
<header id="head">
  <h1>Thumb Party M13: "Toy Box Toon" mock-ups</h1>
  <p>For the owner's review before any code. Design: docs/design/look-and-sound.md. Pictures are drawn by hand in SVG to show the look; the real screens are drawn by the apps.</p>
  <div class="bar">
    <button id="b-sunny">Sunny (recommended)</button><button id="b-night">Night</button>
    <button id="b-fx1">Effects on</button><button id="b-fx0">Effects off</button>
  </div>
</header>
<main id="out"></main>
<script src="mockup-parts.js"></script>
<script>
// ---- Frames
const F = [];
F.push(['The parts', 'Palette, buttons (normal, focused by the controller, pressed), badges, a card, and the same pieces drawn without and with the shader. Right and wrong keep their ✓ and ✗.', 960, 540, () => {
  let g = bg(960, 540);
  g += txt(30, 50, 'Toy Box Toon parts', 34, { fill: T.onBg });
  const sw = [['ink', T.ink], ['paper', T.paper], ['board', T.board], ['focus', C.focus], ['good', C.good], ['caution', C.caution], ['bad', C.bad]];
  sw.forEach(([n, c], i) => { g += card(30 + i * 72, 72, 58, 46, { fill: c, ow: 3 }) + txt(59 + i * 72, 136, n, 13, { anchor: 'middle', font: 'Nunito', fill: T.onBg }); });
  C.p.forEach((c, i) => g += badge(570 + i * 58, 96, 21, i + 1, c));
  g += btn(30, 170, 180, 58, 'Play', { color: C.good });
  g += btn(240, 170, 180, 58, 'Play', { color: C.good, state: 'focus' });
  g += btn(450, 170, 180, 58, 'Play', { color: C.good, state: 'pressed' });
  ['normal', 'focused', 'pressed'].forEach((s, i) => g += txt(120 + i * 210, 252, s, 14, { anchor: 'middle', font: 'Nunito', fill: T.onBg }));
  g += card(670, 160, 260, 160, { header: 'P2 is away', hc: C.caution, hs: 22, hh: 46 }) + txt(800, 248, '0:24', 40, { anchor: 'middle', w: 700 }) + txt(800, 292, 'The round waits for them', 15, { anchor: 'middle', font: 'Nunito' });
  const row = (y, fx, label) => {
    const keep = FX; FX = fx;
    let r = toy('circle', 40, y, 90, 90, C.crown) + toy('rect', 160, y + 5, 80, 80, C.roof) + toy('tri', 270, y, 96, 90, C.sun) + toy('rect', 396, y + 22, 120, 46, C.hill);
    FX = keep;
    return r + txt(540, y + 52, label, 18, { font: 'Nunito', fill: T.onBg });
  };
  g += row(300, false, 'Effects off (drawn)');
  g += row(420, true, 'Effects on (shader)');
  g += target('circle', 740, 380, 70, 70, dark(C.crown, .12)) + target('tri', 830, 380, 76, 70, T.neutral);
  g += txt(775, 470, 'Easy', 14, { anchor: 'middle', font: 'Nunito', fill: T.onBg }) + txt(868, 470, 'Medium, Hard', 14, { anchor: 'middle', font: 'Nunito', fill: T.onBg });
  g += check(760, 505, 15, true) + check(850, 505, 15, false);
  return g;
}]);
F.push(['TV: pick a game', 'The game picker. The controller\'s focus is on Shape Race: a thick yellow ring, readable from across the room. Each game is a big card with a drawn picture.', 960, 540, () => {
  let g = bg(960, 540);
  g += txt(480, 78, 'Pick a game', 50, { anchor: 'middle', fill: '#fff', stroke: T.ink, sw: 9 });
  g += focusRing(120, 120, 330, 300, 18) + card(120, 120, 330, 300, { header: 'Shape Race', hc: C.p[0], hh: 58, hs: 30 });
  g += toy('circle', 180, 200, 110, 100, C.crown) + toy('rect', 222, 292, 24, 80, C.trunk) + toy('circle', 340, 196, 54, 54, C.sun) + toy('tri', 300, 290, 120, 92, C.hill);
  g += card(510, 120, 330, 300, { header: 'Arena', hc: C.p[1], hh: 58, hs: 30 });
  g += toy('rect', 545, 210, 26, 150, T.wall, { glint: false }) + marble(640, 300, 34, C.p[0], 1) + flag(730, 230, 90, 110);
  g += btn(205, 450, 220, 56, 'Puzzle settings') + btn(450, 450, 140, 56, 'Stats') + btn(615, 450, 140, 56, 'Back');
  g += txt(940, 528, 'D-pad: move · A: select · B: back', 15, { anchor: 'end', font: 'Nunito', fill: T.onBg });
  return g;
}]);
F.push(['TV: join screen', 'Players press A on their phone to join a side. The join code sits top right. Lobby music plays here (and on the game picker).', 960, 540, () => {
  let g = bg(960, 540);
  g += txt(40, 66, 'Shape Race', 44, { fill: '#fff', stroke: T.ink, sw: 8 }) + txt(318, 66, 'Easy · Tree', 26, { fill: T.onBg });
  g += card(720, 26, 210, 56, { ow: 3.5 }) + txt(740, 62, 'Code', 18, { font: 'Nunito' }) + txt(912, 63, '4821', 32, { anchor: 'end', w: 700 });
  const side = (x, title, c, players) => {
    let s = card(x, 110, 400, 260, { header: title, hc: c, hh: 52, hs: 26 });
    players.forEach((p, i) => {
      const y = 200 + i * 74;
      if (p) s += badge(x + 50, y, 24, p[0], C.p[p[0] - 1]) + txt(x + 88, y + 8, p[1], 24, { font: 'Nunito', w: 800 }) + check(x + 360, y, 15, true);
      else s += `<rect x="${x + 24}" y="${y - 28}" width="352" height="56" rx="28" fill="none" stroke="${T.ink}" stroke-opacity=".45" stroke-width="3" stroke-dasharray="8 7"/>` + txt(x + 200, y + 7, 'Press A on a phone to join', 19, { anchor: 'middle', font: 'Nunito', fill: dark(T.paper, .5) });
    });
    return s;
  };
  g += side(60, 'Side 1', light(C.p[0], .25), [[1, "Mia's phone"], null]);
  g += side(500, 'Side 2', light(C.p[1], .25), [[2, "Dad's phone"], [3, 'Android phone 6671']]);
  g += btn(270, 410, 200, 64, 'Start', { color: C.good, state: 'focus' }) + btn(500, 410, 190, 64, 'Back');
  g += txt(480, 512, 'Press A or Start to begin.', 20, { anchor: 'middle', font: 'Nunito', w: 800, fill: T.onBg });
  return g;
}]);
const raceTV = (o = {}) => {
  let g = bg(960, 540, { dots: false });
  // Side 1 pushes the hill towards its outline; side 2 just dropped it in the wrong place.
  g += boardSide(24, 70, 440, 450, { placed: [0, 2], held: [3, .44, .36], player: 1, easy: true,
    after: c => { const [px, py, pw, ph] = c.held; return worker(px + pw * .02 - c.r * .9, py + ph * .72, c.r, c.col, c.pl, 'push', { hands: [[px + pw * .14, py + ph * .72], [px + pw * .2, py + ph * .6]] }); } });
  g += boardSide(496, 70, 440, 450, { placed: [0], player: 2, easy: true, wrong: o.wrong ? [3, .5, .56] : null,
    after: c => c.wrong ? (() => { const [px, py, pw, ph] = c.wrong; return worker(px - c.r * 1.3, py + ph * .45, c.r, c.col, c.pl, 'oops'); })() : worker(c.ox + .75 * c.bh, c.by + .3 * c.bh, c.r, c.col, c.pl, 'idle') });
  g += clockChip(480, 10, '1:24', 30);
  g += badge(60, 36, 20, 1, C.p[0]) + txt(90, 46, '2 / 4', 28, { fill: T.onBg, w: 700 });
  g += badge(900, 36, 20, 2, C.p[1]) + txt(870, 46, '1 / 4', 28, { anchor: 'end', fill: T.onBg, w: 700 });
  return g;
};
F.push(['TV: Shape Race, 1 vs 1', 'Each side: the tray on top, the cream play mat below. Targets are dashed outlines (Easy: in the piece\'s colour). Placed pieces lock with a sparkle; the player\'s dot is a numbered marble carrying a piece. Side 2 just made a wrong drop: red outline and ✗.', 960, 540, () => raceTV({ wrong: true })]);
F.push(['TV: results', 'The results card pops in over the dimmed boards, in the winner\'s colour, with confetti. Rematch has the focus.', 960, 540, () => {
  let g = raceTV() + `<rect width="960" height="540" fill="${T.ink}" fill-opacity=".5"/>`;
  const conf = [[250, 90, C.p[0]], [300, 60, C.focus], [690, 80, C.p[4]], [720, 130, C.good], [220, 160, C.p[2]], [760, 60, C.p[1]], [640, 50, C.p[3]]];
  conf.forEach(([x, y, c], i) => g += `<rect x="${x}" y="${y}" width="16" height="9" rx="2" fill="${c}" stroke="${T.ink}" stroke-width="2" transform="rotate(${i * 37} ${x} ${y})"/>`);
  g += card(250, 90, 460, 380, { header: 'Side 1 wins!', hc: C.p[0], hh: 72, hs: 38 });
  g += badge(310, 210, 22, 1, C.p[0]) + txt(345, 219, 'Side 1', 26, { font: 'Nunito', w: 800 }) + txt(560, 219, '0:58', 28, { w: 700 }) + txt(680, 219, '4/4', 24, { anchor: 'end', font: 'Nunito', w: 800 });
  g += badge(310, 268, 22, 2, C.p[1]) + txt(345, 277, 'Side 2', 26, { font: 'Nunito', w: 800 }) + txt(560, 277, '—', 28, { w: 700 }) + txt(680, 277, '3/4', 24, { anchor: 'end', font: 'Nunito', w: 800 });
  g += sparkle(645, 150, 14, '#FFF6B0') + sparkle(300, 140, 10, '#FFF6B0');
  g += btn(285, 330, 180, 56, 'Rematch', { color: C.good, state: 'focus' }) + btn(495, 330, 180, 56, 'Change teams');
  g += btn(390, 400, 180, 50, 'Back');
  return g;
}]);
F.push(['TV: Arena', 'The shader\'s first game, as planned. Marbles with eyes that look where they roll, toy-block walls, red bumpers, a goal pad with a flag. The top bar is a paper strip.', 960, 540, () => {
  const id = 'm' + (++uid);
  defs.push(`<pattern id="${id}" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="24" cy="24" r="3" fill="${T.ink}" fill-opacity=".12"/></pattern>`);
  let g = `<rect width="960" height="540" fill="${T.field}"/><rect width="960" height="540" fill="url(#${id})"/>`;
  g += `<circle cx="80" cy="292" r="40" fill="${T.ink}" fill-opacity=".08" stroke="${T.ink}" stroke-opacity=".35" stroke-width="3" stroke-dasharray="8 7"/>`;
  [[222, 40, 22, 290], [446, 250, 22, 300], [665, 40, 22, 190], [665, 350, 22, 200], [282, 390, 110, 22]].forEach(([x, y, w, h]) => g += toy('rect', x, y, w, h, T.wall, { glint: false, shadow: 5 }));
  [[340, 110], [560, 345], [708, 315], [305, 480]].forEach(([x, y]) => g += bumper(x, y, 22));
  g += flag(828, 232, 100, 120) + txt(878, 342, 'GOAL', 22, { anchor: 'middle', w: 700 });
  g += marble(198, 292, 22, C.p[0], 1) + `<path d="M150 292 h-28 M154 280 h-18 M154 304 h-18" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`;
  g += `<rect x="0" y="0" width="960" height="44" fill="${T.paper}"/><line x1="0" y1="44" x2="960" y2="44" stroke="${T.ink}" stroke-width="3.5"/>`;
  g += txt(20, 30, 'Round 1', 20) + txt(130, 30, '16.3 s', 20, { w: 700 }) + txt(230, 30, 'Best —', 20);
  g += badge(345, 22, 13, 1, C.p[0]) + txt(366, 29, 'Android phone 6671', 17, { font: 'Nunito', w: 800 }) + txt(560, 29, 'Wins 0 · Hits 1', 17, { font: 'Nunito' });
  g += card(720, 7, 160, 30, { fill: C.good, ow: 3 }) + txt(800, 28, 'Dash ready (A)', 16, { anchor: 'middle', font: 'Nunito', w: 800 });
  return g;
}]);
F.push(['Phone: Shape Race on a joined phone', 'Your own side fills the screen, the strip on top shows the clock, your count and the other side\'s board small. The controls float on top at the opacity setting (60% here); their sizes don\'t change.', 816, 384, () => {
  const W = 780, H = 360;
  let g = bg(W, H, { dots: false });
  g += boardSide(170, 58, 440, 296, { placed: [0], held: [2, .66, .2], player: 1, easy: true, r: 21,
    after: c => { const [px, py, pw, ph] = c.held; return worker(px - c.r * .95, py + ph * .55, c.r, c.col, c.pl, 'carry', { look: [1, 0], hands: [[px + pw * .06, py + ph * .62], [px + pw * .1, py + ph * .38]] }); } });
  g += `<rect x="0" y="0" width="${W}" height="48" fill="${T.paper}"/><line x1="0" y1="48" x2="${W}" y2="48" stroke="${T.ink}" stroke-width="3"/>`;
  g += badge(196, 24, 14, 1, C.p[0]) + txt(218, 33, '1 / 4', 22, { w: 700 });
  g += txt(390, 34, '1:24', 28, { anchor: 'middle', w: 700 });
  g += card(520, 6, 46, 36, { fill: T.board, ow: 3 }) + `<rect x="520" y="6" width="46" height="36" rx="8" fill="none" stroke="${C.p[1]}" stroke-width="3.5"/>` + toy('circle', 528, 12, 14, 14, C.crown, { shadow: 0, ow: 1.5, glint: false });
  g += txt(576, 33, 'Them 2 / 4', 18, { font: 'Nunito', w: 800 });
  g += `<g opacity=".6">${pad(30, 170, 130)}${faces(680, 245, 26, 50)}${btn(24, 66, 62, 26, 'Select', { size: 11 })}${btn(96, 66, 62, 26, 'Start', { size: 11 })}</g>`;
  return phone(W, H, g);
}]);
F.push(['Phone: connect screen', 'The first screen on a phone: TVs and phone hosts nearby, and Host a game. Same buttons, cards and font as the TV.', 816, 384, () => {
  const W = 780, H = 360;
  let g = bg(W, H);
  const d = [['Y', 0, -1], ['X', -1, 0], ['B', 1, 0], ['A', 0, 1]];
  d.forEach(([k, dx, dy]) => g += toy('circle', 120 + dx * 34 - 20, 92 + dy * 34 - 20, 40, 40, C.face[k], { ow: 3, shadow: 4 }));
  g += txt(120, 190, 'Thumb Party', 34, { anchor: 'middle', fill: '#fff', stroke: T.ink, sw: 7 });
  g += txt(120, 222, 'Your phone is the controller', 14, { anchor: 'middle', font: 'Nunito', w: 800, fill: T.onBg });
  g += card(262, 22, 496, 230, { header: 'Play on a screen nearby', hc: light(C.p[0], .3), hh: 46, hs: 21 });
  g += focusRing(282, 84, 456, 58, 29) + btn(282, 84, 456, 58, '', {}) + txt(306, 121, '📺', 24) + txt(344, 121, 'Living room TV', 21, { font: 'Nunito', w: 800 }) + txt(722, 121, 'TV', 15, { anchor: 'end', font: 'Nunito' });
  g += btn(282, 158, 456, 58, '') + txt(306, 195, '📱', 22) + txt(344, 195, "Sam's phone", 21, { font: 'Nunito', w: 800 }) + txt(722, 195, 'Phone', 15, { anchor: 'end', font: 'Nunito' });
  g += btn(262, 280, 300, 60, 'Host a game', { color: C.good }) + btn(580, 280, 178, 60, 'Settings');
  g += txt(120, 300, 'Type an address', 15, { anchor: 'middle', font: 'Nunito', w: 800, fill: T.onBg, extra: 'text-decoration="underline"' });
  return phone(W, H, g);
}]);
F.push(['Phone: paused', 'Cards over the game use the same paper card with a coloured header. The controls stay visible but faded.', 816, 384, () => {
  const W = 780, H = 360;
  let g = bg(W, H, { dots: false }) + boardSide(170, 58, 440, 296, { placed: [0, 2], player: 1, easy: true });
  g += `<rect width="${W}" height="${H}" fill="${T.ink}" fill-opacity=".5"/>`;
  g += card(230, 50, 320, 250, { header: 'Paused', hc: C.focus, hh: 54, hs: 28 });
  g += badge(300, 150, 20, 2, C.p[1]) + txt(330, 158, 'P2 paused the game', 19, { font: 'Nunito', w: 800 });
  g += txt(390, 196, 'P2 or P1 can resume', 15, { anchor: 'middle', font: 'Nunito' });
  g += btn(255, 228, 130, 50, 'Resume', { color: C.good, state: 'focus' }) + btn(400, 228, 125, 50, 'Quit', { color: light(C.bad, .2) });
  return phone(W, H, g);
}]);

F.push(['Shape Race: the worker', 'The player\'s dot becomes the worker: eyes, arms, its number on its tummy, and faces that follow what it\'s doing. Everything is worked out from the game\'s state, so a joined phone shows the same faces. The rules don\'t change.', 960, 540, () => {
  let g = bg(960, 540);
  const lab = (x, y, s) => txt(x, y, s, 15, { anchor: 'middle', font: 'Nunito', w: 800, fill: T.onBg });
  const top = [['idle', 'Waiting'], ['move', 'Moving'], ['happy', 'Right drop'], ['oops', 'Wrong drop'], ['call', 'Calling a teammate'], ['away', 'Player away']];
  top.forEach(([p, l], i) => { const x = 85 + i * 158; g += worker(x, 120, 30, C.p[i % 4], (i % 4) + 1, p) + lab(x, 200, l); });
  // Carrying a small piece
  g += toy('circle', 100, 305, 66, 66, C.sun) + worker(80, 348, 24, C.p[0], 1, 'carry', { look: [1, 0], hands: [[104, 352], [108, 324]] }) + lab(110, 430, 'Carrying');
  // Pushing: behind the piece, moving right
  g += toy('rect', 290, 300, 72, 72, C.roof) + worker(262, 350, 24, C.p[1], 2, 'push', { hands: [[292, 350], [294, 322]] }) + arrow(302, 282, 46, 16) + lab(305, 430, 'Pushing');
  // Pulling: in front of the piece, moving right, leaning back
  g += toy('rect', 440, 300, 72, 72, C.hill) + worker(548, 350, 24, C.p[2], 3, 'pull', { hands: [[514, 348], [514, 322]] }) + arrow(452, 282, 46, 16) + lab(490, 430, 'Pulling');
  // A big piece alone: the strongest effort (the dashed ring is the call for a teammate)
  g += toy('rect', 652, 304, 110, 64, C.crown) + `<rect x="644" y="296" width="126" height="80" rx="16" fill="none" stroke="${C.focus}" stroke-width="4" stroke-dasharray="10 8"/>` +
    worker(626, 352, 24, C.p[3], 4, 'strain', { lean: 6, hands: [[654, 352], [656, 328]] }) + lab(690, 430, 'A big piece, alone');
  // Two workers carry a big piece together
  g += toy('rect', 832, 306, 84, 58, C.trunk) + worker(812, 350, 20, C.p[0], 1, 'team', { look: [1, 0], hands: [[834, 352], [836, 330]] }) +
    worker(936, 350, 20, C.p[1], 2, 'team', { look: [-1, 0], hands: [[914, 352], [912, 330]] }) + lab(874, 430, 'Together');
  g += txt(480, 500, 'Faces also show while rotating (tongue out), and a cheer or a shrug at the end of the round.', 16, { anchor: 'middle', font: 'Nunito', w: 700, fill: T.onBg });
  return g;
}]);
F.push(['TV: Look and sound settings', 'A new settings section, on the TV and on phones. Look: Auto follows the device\'s clock (Sunny from 7 am to 7 pm, Night after), or pick one. A Look change shows at once, a round in progress included.', 960, 540, () => {
  let g = bg(960, 540);
  g += txt(40, 66, 'Settings', 46, { fill: '#fff', stroke: T.ink, sw: 8 });
  ['Controllers', 'Look and sound', 'Stats', 'About'].forEach((s, i) => g += btn(40, 110 + i * 82, 240, 58, s, { color: i === 1 ? light(C.p[0], .35) : T.paper, size: 22 }));
  g += card(320, 100, 610, 410, { header: 'Look and sound', hc: light(C.p[0], .35), hh: 54, hs: 26 });
  g += txt(350, 196, 'Look', 26, { w: 700 });
  const seg = ['Auto', 'Sunny', 'Night'];
  g += focusRing(470, 168, 420, 50, 25);
  seg.forEach((s, i) => {
    const x = 470 + i * 140, on = i === 0;
    g += `<rect x="${x}" y="168" width="140" height="50" fill="${on ? C.focus : T.paper}" stroke="${T.ink}" stroke-width="3" ${i === 0 ? 'rx="0"' : ''}/>`;
  });
  g += `<rect x="470" y="168" width="420" height="50" rx="25" fill="none" stroke="${T.ink}" stroke-width="3.5"/>`;
  seg.forEach((s, i) => g += txt(540 + i * 140, 195, s, 22, { anchor: 'middle', base: 'middle' }));
  defs.push(`<clipPath id="segc"><rect x="470" y="168" width="420" height="50" rx="25"/></clipPath>`);
  g = g.replace(/(<rect x="(470|610|750)" y="168" width="140")/g, '$1 clip-path="url(#segc)"');
  g += txt(350, 248, 'Auto follows the clock: Sunny from 7 am to 7 pm, Night after.', 16, { font: 'Nunito', w: 700, fill: dark(T.paper, .55) });
  const row = (y, label, sub, on) => txt(350, y, label, 24, { w: 600 }) + txt(350, y + 24, sub, 15, { font: 'Nunito', w: 700, fill: dark(T.paper, .55) }) + toggle(830, y - 26, on);
  g += row(306, 'Effects', 'Shading, shine and moving backgrounds', true);
  g += row(376, 'Music', 'Plays on the screen that hosts the game', true);
  g += txt(350, 452, 'Volume', 24, { w: 600 });
  g += `<rect x="470" y="436" width="420" height="20" rx="10" fill="#D8D2C4" stroke="${T.ink}" stroke-width="3"/><rect x="470" y="436" width="336" height="20" rx="10" fill="${C.p[0]}" stroke="${T.ink}" stroke-width="3"/>`;
  g += toy('circle', 788, 428, 36, 36, '#FFFFFF', { ow: 3, shadow: 3, glint: false }) + txt(806, 490, '80%', 18, { anchor: 'middle', w: 700 });
  return g;
}]);

startPage(F);
</script>
</body>
</html>
