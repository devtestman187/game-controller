<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="scr"><rect width="852" height="393" rx="32"/></clipPath>
    <!-- The phone in a 1v1 Shape Race, build 3 layout: you have placed the crown. -->
    <g id="base">
      <rect x="-12" y="-12" width="876" height="417" rx="44" fill="#2a2d34"/>
      <rect width="852" height="393" rx="32" fill="#12161d"/>
      <g clip-path="url(#scr)">
        <rect x="291" y="112" width="270" height="273" rx="8" fill="#232a36"/>
        <circle cx="363" cy="254" r="52" fill="#2bb365"/>
        <rect x="348" y="299" width="30" height="66" fill="none" stroke="#a0673d" stroke-width="2.5" stroke-dasharray="7 5"/>
        <circle cx="503" cy="161" r="30" fill="none" stroke="#e8c13a" stroke-width="2.5" stroke-dasharray="7 5"/>
        <polygon points="437,365 541,365 489,291" fill="none" stroke="#8a96a3" stroke-width="2.5" stroke-dasharray="7 5"/>
        <rect x="259" y="8" width="335" height="96" rx="8" fill="#1d232d"/>
        <polygon points="300,85 381,85 340,27" fill="#8a96a3"/>
        <circle cx="430" cy="56" r="23" fill="#e8c13a"/>
        <rect x="485" y="30" width="23" height="52" fill="#a0673d"/>
        <circle cx="150" cy="185" r="85" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
        <circle cx="150" cy="185" r="36" fill="#ffffff" fill-opacity="0.08"/>
        <circle cx="620" cy="320" r="68" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
        <circle cx="700" cy="120" r="30" fill="none" stroke="#c9a227" stroke-opacity="0.35" stroke-width="3"/>
        <circle cx="655" cy="168" r="30" fill="none" stroke="#3a7bd5" stroke-opacity="0.35" stroke-width="3"/>
        <circle cx="745" cy="168" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
        <circle cx="700" cy="216" r="30" fill="none" stroke="#2bb365" stroke-opacity="0.35" stroke-width="3"/>
        <rect x="24" y="12" width="40" height="28" rx="14" fill="#2d4d7a" fill-opacity="0.6"/>
        <text x="44" y="31" font-size="14" fill="#cfd8e3" text-anchor="middle" fill-opacity="0.7">P1</text>
        <circle cx="78" cy="26" r="5" fill="#2bb365" fill-opacity="0.6"/>
        <rect x="92" y="12" width="66" height="28" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.15"/>
        <text x="125" y="31" font-size="14" fill="#cfd8e3" fill-opacity="0.6" text-anchor="middle">4541</text>
        <rect x="748" y="16" width="22" height="18" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
        <circle cx="796" cy="25" r="10" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
        <rect x="818" y="16" width="22" height="18" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
        <circle cx="440" cy="200" r="10" fill="#4f9dff" stroke="#ffffff" stroke-width="2"/>
        <text x="440" y="205" font-size="12" fill="#ffffff" text-anchor="middle">1</text>
      </g>
    </g>
  </defs>

  <rect width="680" height="1500" fill="#ffffff"/>

  <!-- Today -->
  <text x="20" y="28" font-size="17" fill="#222">Today (build 3)</text>
  <text x="20" y="47" font-size="12" fill="#555">Only a count tells you how the other player is doing.</text>
  <g transform="translate(20,62) scale(0.75)">
    <use href="#base"/>
    <text x="26" y="80" font-size="30" font-weight="bold" fill="#ffffff">1:31</text>
    <text x="104" y="79" font-size="16" fill="#9aa4b2">You 1/4 · Them 2/4</text>
    <rect x="28" y="90" width="200" height="5" rx="2.5" fill="#323a47"/>
    <rect x="28" y="90" width="133" height="5" rx="2.5" fill="#2bb365"/>
  </g>

  <!-- Option A -->
  <text x="20" y="388" font-size="17" fill="#222">Option A: a mini board in the clock's corner (recommended)</text>
  <text x="20" y="407" font-size="12" fill="#555">A small copy of their board, top left, with the pieces they've placed filled in, live. The clock sits beside it.</text>
  <g transform="translate(20,422) scale(0.75)">
    <use href="#base"/>
    <rect x="20" y="46" width="66" height="67" rx="4" fill="#232a36" stroke="#f08a3c" stroke-width="2"/>
    <circle cx="39" cy="80" r="12.5" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2"/>
    <polygon points="57,106 82,106 70,89" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2"/>
    <circle cx="73" cy="58" r="7.2" fill="#e8c13a"/>
    <rect x="36" y="91" width="7.2" height="15.8" fill="#a0673d"/>
    <text x="100" y="74" font-size="30" font-weight="bold" fill="#ffffff">1:31</text>
    <text x="176" y="73" font-size="16" fill="#9aa4b2">You 1/4</text>
    <text x="100" y="98" font-size="16" fill="#f08a3c">Them 2/4</text>
  </g>

  <!-- Option B -->
  <text x="20" y="748" font-size="17" fill="#222">Option B: their pieces marked on your board</text>
  <text x="20" y="767" font-size="12" fill="#555">You race the same puzzle, so a spot they've filled gets an orange tint on yours. No extra room needed.</text>
  <g transform="translate(20,782) scale(0.75)">
    <use href="#base"/>
    <circle cx="503" cy="161" r="30" fill="#f08a3c" fill-opacity="0.28" stroke="#f08a3c" stroke-width="2.5"/>
    <rect x="348" y="299" width="30" height="66" fill="#f08a3c" fill-opacity="0.28" stroke="#f08a3c" stroke-width="2.5"/>
    <text x="26" y="80" font-size="30" font-weight="bold" fill="#ffffff">1:31</text>
    <text x="104" y="79" font-size="16" fill="#9aa4b2">You 1/4 ·</text>
    <text x="180" y="79" font-size="16" fill="#f08a3c">Them 2/4</text>
    <rect x="28" y="90" width="200" height="5" rx="2.5" fill="#323a47"/>
    <rect x="28" y="90" width="133" height="5" rx="2.5" fill="#2bb365"/>
  </g>

  <!-- Option C -->
  <text x="20" y="1108" font-size="17" fill="#222">Option C: a row of their pieces under the clock</text>
  <text x="20" y="1127" font-size="12" fill="#555">One small icon per piece for each of you; it fills in when that piece is placed. Shows which, not where.</text>
  <g transform="translate(20,1142) scale(0.75)">
    <use href="#base"/>
    <text x="26" y="66" font-size="28" font-weight="bold" fill="#ffffff">1:31</text>
    <text x="26" y="88" font-size="14" fill="#9aa4b2">You</text>
    <circle cx="82" cy="83" r="7" fill="#2bb365"/>
    <polygon points="94,90 108,90 101,76" fill="none" stroke="#9aa4b2" stroke-width="1.8"/>
    <circle cx="121" cy="83" r="6" fill="none" stroke="#9aa4b2" stroke-width="1.8"/>
    <rect x="133" y="76" width="6" height="14" fill="none" stroke="#9aa4b2" stroke-width="1.8"/>
    <text x="26" y="110" font-size="14" fill="#f08a3c">Them</text>
    <circle cx="82" cy="105" r="7" fill="none" stroke="#f08a3c" stroke-width="1.8"/>
    <polygon points="94,112 108,112 101,98" fill="none" stroke="#f08a3c" stroke-width="1.8"/>
    <circle cx="121" cy="105" r="6" fill="#f08a3c"/>
    <rect x="133" y="98" width="6" height="14" fill="#f08a3c"/>
  </g>

  <text x="20" y="1478" font-size="11" fill="#666">To scale on an 852×393 iPhone, tree puzzle, 1v1: you placed the crown, they placed the sun and trunk. Orange = them.</text>
</svg>
