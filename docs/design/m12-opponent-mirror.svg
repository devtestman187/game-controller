  <rect width="680" height="760" fill="#ffffff"/>

  <!-- Option A -->
  <text x="20" y="28" font-size="17" fill="#222">Option A: a mini board in the clock's corner (recommended)</text>
  <text x="20" y="47" font-size="12" fill="#555">A small copy of their board, top left, with the pieces they've placed filled in, live. The clock sits beside it.</text>
  <g transform="translate(20,62) scale(0.75)">
    <use href="#base"/>
    <rect x="20" y="46" width="66" height="67" rx="4" fill="#232a36" stroke="#f08a3c" stroke-width="2"/>
    <circle cx="39" cy="80" r="12.5" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2"/>
    <polygon points="57,106 82,106 70,89" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2"/>
    <circle cx="73" cy="58" r="7.2" fill="#e8c13a"/>
    <rect x="36" y="91" width="7.2" height="15.8" fill="#a0673d"/>
    <text x="100" y="74" font-size="30" font-weight="bold" fill="#ffffff">1:31</text>
    <text x="176" y="73" font-size="16" fill="#9aa4b2">You 1/4</text>
    <text x="100" y="98" font-size="16" fill="#f08a3c">Them 2/4</text>
  </g>

  <!-- Option A, mirrored -->
  <text x="20" y="388" font-size="17" fill="#222">Option A, mirrored: their whole phone, live</text>
  <text x="20" y="407" font-size="12" fill="#555">Their tray and board at a quarter size: their dot moves, picks up, carries and turns pieces as they do.</text>
  <g transform="translate(20,422) scale(0.75)">
    <use href="#base"/>
    <rect x="15" y="41" width="82" height="91" rx="5" fill="#12161d" stroke="#f08a3c" stroke-width="2"/>
    <rect x="19" y="45" width="73.7" height="21.1" rx="2" fill="#1d232d"/>
    <circle cx="29.1" cy="55.6" r="8.8" fill="#2bb365"/>
    <rect x="26.0" y="67.9" width="59.4" height="60.1" rx="2" fill="#232a36"/>
    <circle cx="41.9" cy="99.1" r="11.4" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.1" stroke-dasharray="2.5 2"/>
    <polygon points="58.2,123.5 81.0,123.5 69.6,107.3" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.1" stroke-dasharray="2.5 2"/>
    <circle cx="72.7" cy="78.7" r="6.6" fill="#e8c13a"/>
    <rect x="38.6" y="109.0" width="6.6" height="14.5" fill="#a0673d"/>
    <polygon points="52,100 70,100 61,87" fill="#8a96a3" transform="rotate(-15 61 95)"/>
    <circle cx="61" cy="94" r="3.6" fill="#f08a3c" stroke="#ffffff" stroke-width="1"/>
    <text x="108" y="74" font-size="30" font-weight="bold" fill="#ffffff">1:31</text>
    <text x="184" y="73" font-size="16" fill="#9aa4b2">You 1/4</text>
    <text x="108" y="98" font-size="16" fill="#f08a3c">Them 2/4</text>
  </g>

  <text x="20" y="748" font-size="11" fill="#666">To scale on an 852×393 iPhone, 1v1: in the mirror they're carrying the mountain, turning it. Orange = them.</text>
</svg>
