<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thumb Party TV</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #eee;
      font: 16px/1.4 system-ui, sans-serif;
    }

    /* The stream fills the screen with no browser controls: this page is a TV. */
    #screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* A small button in the corner and the keyboard's "s" show the numbers. */
    #stats {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.65);
      font: 13px/1.45 ui-monospace, monospace;
      white-space: pre;
      pointer-events: none;
      display: none;
    }

    #stats.visible {
      display: block;
    }

    #toggle {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      color: #eee;
      font: 18px/1 system-ui, sans-serif;
      cursor: pointer;
      opacity: 0.35;
    }

    #toggle:hover,
    #toggle:focus-visible {
      opacity: 1;
    }

    /* Covers the screen when the browser will not start the sound alone. */
    #sound {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(0, 0, 0, 0.55);
      border: none;
      color: #fff;
      font: 24px/1.4 system-ui, sans-serif;
      cursor: pointer;
    }

    #sound.visible {
      display: grid;
    }

    #status {
      position: absolute;
      bottom: 12px;
      left: 12px;
      font: 13px/1.4 ui-monospace, monospace;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <video id="screen" autoplay muted playsinline disablepictureinpicture></video>
  <!-- The sound, on its own element when the session splits the two tracks
       (M15 t1): a video element held back to match its audio buffers less. -->
  <audio id="sound-track" autoplay></audio>
  <div id="stats"></div>
  <div id="status">connecting…</div>
  <button id="toggle" title="Show statistics (S)">i</button>
  <button id="sound">Tap to start sound</button>

  <!-- gstwebrtc-api is the browser client that ships with gst-plugins-rs
       (MPL-2.0). The image carries the built bundle; see streaming/README.md. -->
  <script src="lib/gstwebrtc-api-2.0.0.min.js"></script>
  <!-- entrypoint.sh writes this next to the page: the session's signalling port. -->
  <script src="config.js"></script>
  <script type="module" src="player.js"></script>
</body>

</html>
