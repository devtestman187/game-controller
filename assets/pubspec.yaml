name: game_assets
description: Shared images and audio for both apps, loaded through one asset manifest.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: '>=3.38.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

# Asset folders are declared here. Declaring a whole folder means files dropped
# into it are bundled without code changes (lib/asset_manifest.dart finds
# them). Files in branding/ are source art for platform icons and banners and
# are not bundled.
flutter:
  assets:
    - audio/
