name: tvtest
description: "TV test app for the phone controller (Android TV + Windows desktop)."
publish_to: 'none'

version: 0.11.0+13

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  connection:
    path: ../packages/connection
  game_assets:
    path: ../assets
  metrics:
    path: ../packages/metrics
  party_host:
    path: ../packages/party_host
  puzzle_game:
    path: ../packages/puzzle_game
  protocol:
    path: ../packages/protocol
  shared_preferences: ^2.5.6
  test_game:
    path: ../packages/test_game
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
