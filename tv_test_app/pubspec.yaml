name: tvtest
description: "TV test app for the phone controller (Android TV + Windows desktop)."
publish_to: 'none'

version: 0.2.0+3

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  bonsoir: ^7.1.5
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  connection:
    path: ../packages/connection
  protocol:
    path: ../packages/protocol
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
