name: tvtest
description: "TV test app for the phone controller (Android TV + Windows desktop)."
publish_to: 'none'

version: 0.8.0+11

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  bonsoir: ^7.1.5
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_soloud: ^5.2.1
  connection:
    path: ../packages/connection
  game_assets:
    path: ../assets
  protocol:
    path: ../packages/protocol
  shared_preferences: ^2.5.6
  test_game:
    path: ../packages/test_game
  path_provider: ^2.1.6
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
